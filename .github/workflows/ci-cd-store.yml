name: Electro API  CI/CD
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "Project2/electro-chart/values.yaml"
  pull_request:
    branches:
      - main
permissions:
   contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project2/build_aside_projects/Electro_API2 
    #as we put .github at parent directory 

    steps:
      - name: Checkout repository
        uses:  actions/checkout@v4
      - name: Set up  .Net
        uses: actions/setup-dotnet@v4
        with:  
          dotnet-version: "8.0.x"   #this will  fetch the latest version
      - name: Restore Dependencies
        run: dotnet  restore  ElectroAPI.csproj
      - name: Build
        run: dotnet build ElectroAPI.csproj --no-restore --configuration  Release
      - name:  Test
        run: dotnet test --no-build --configuration Release
  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint Project2/electro-chart
      - name: Render Helm templates
        run: |
          helm template electro-api  Project2/electro-chart


  docker-build:
     needs:
       - test
       - helm
     runs-on: ubuntu-latest
     steps:
       - name: Checkout repo
         uses: actions/checkout@v4
       - name:  setup docker buildx
         uses: docker/setup-buildx-action@v3
       - name: login to Dockerhub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}
       - name: Generate image version 
         id: version
         run: |
           if [[ "${GITHUB_REF_TYPE}" ==  "tag"]]; then
           VERSION="${GITHUB_REF_NAME#v}"
           else
           VERSION="0.0.${GITHUB_RUN_NUMBER}"   
           fi
           echo "version=$VERSION">>"$GITHUB_OUTPUT"
    # if you push version=1.2.0 -> it will detected and updated image will have it but if you push main -> the output also will be numbers not :main -> 0.0.10 (example). 
      - name: build and push multi-platforms image
        run: |
            docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/electro-app:${{ steps.version.outputs.version }} \
           --push Project2/build_aside_projects/Electro_API2/   
