apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: {{.Release.Name}}
  namespaceSelector:
    matchNames:
      - my-ns
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

