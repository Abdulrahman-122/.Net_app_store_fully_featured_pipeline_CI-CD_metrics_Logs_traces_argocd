apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: flaskblog
  namespaceSelector:
    matchNames:
      - my-ns1
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

