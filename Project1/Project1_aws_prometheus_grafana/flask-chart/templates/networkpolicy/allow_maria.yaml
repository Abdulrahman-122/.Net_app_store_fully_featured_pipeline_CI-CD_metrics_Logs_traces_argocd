apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maria
spec:
  podSelector:
    matchLabels:
      app: mariadb-{{.Values.config.flaskEnv}}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{.Values.config.flaskEnv}}
      ports:
        - protocol: TCP
          port: 3306
  policyTypes:
    - Ingress
