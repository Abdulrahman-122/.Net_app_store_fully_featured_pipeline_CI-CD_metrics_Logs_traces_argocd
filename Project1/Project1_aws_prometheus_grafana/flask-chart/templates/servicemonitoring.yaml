apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{.Release.Name}}-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: {{.Values.config.flaskEnv}}
  namespaceSelector:
    matchNames:
      - my-ns
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
