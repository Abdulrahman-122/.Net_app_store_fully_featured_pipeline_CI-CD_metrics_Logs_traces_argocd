apiVersion:  networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{.Values.config.flaskEnv}}-aws-loadbalance
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-service-{{.Values.config.flaskEnv}}
                port:
                  number: 5000
