apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flask-route
spec:
  entryPoints:
    - web
    - websecure
  routes:
    #- match: Host("flask.local") && PathPrefix(`/api`)
    - match: PathPrefix(`/`)
      kind: Rule
#      middlewares:
#       - name: middle-api
      services:
        - name: flask-service-{{.Values.config.flaskEnv}}

          port: 5000      
  tls:
    secretName: flask-cert-secret
