replicaCount: 1
image:
  repo:  abdulrahmanqasim/electro-app
  tag: v2.0.0
  pullPolicy:  IfNotPresent
service:
  #type: NodePort
  type: ClusterIP
  port: 5000
  targetPort: 5000
  nodePort:  30001
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

database:
  replicaCount: 1
  image: mariadb:12.2
  port: 3306
  targetPort: 3306
  storage:
    size: 2Gi
  
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
hpa:

  enabled: true
  minReplicas: 1
  maxReplicas: 5
  cpu:
    averageUtilization: 60
pdb:
  enabled: true
  minAvailable:  1 

strategy:
  type: RollingUpdate 
  maxUnavailable: 0   
  maxSurge: 1 
serviceMonitor:
  enabled: true
  interval:  15s

    



