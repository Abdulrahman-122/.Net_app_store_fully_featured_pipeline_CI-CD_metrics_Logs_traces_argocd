apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: my-ns1
  labels:
    app: load-generator
spec:
  containers:
    - name: load-generator
      image: busybox:latest
      command:
        - sh
        - -c
        - |
          while true; do
            wget -q -O- http://electro-api:5000/health/live
          done
# once  you ran this command it will send many traffic to the api once this happen ->  hpa will increase so that you will see  whether it will increase the pods or not
