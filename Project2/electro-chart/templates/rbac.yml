apiVersion: v1
kind: ServiceAccount
metadata:
  name: electro-reader
  namespace: my-ns1

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: electro-read-only
  namespace: my-ns1
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: electro-read-only-binding
  namespace: my-ns1
subjects:
  - kind: ServiceAccount
    name: electro-reader
    namespace: my-ns1
roleRef:
  kind: Role
  name: electro-read-only
  apiGroup: rbac.authorization.k8s.io
