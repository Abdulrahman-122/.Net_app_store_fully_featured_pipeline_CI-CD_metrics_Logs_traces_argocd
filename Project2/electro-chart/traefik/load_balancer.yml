service:
  type: LoadBalancer
providers:  #make traefik accept kubernetes settings like ingress of kubernetes and make it the defualt ingress route for that kind cluster
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
ingressClass:
  enabled:  true
  isDefaultClass: true
ports:
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true



